<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldMammoth</title>
<style>
  :root { --ink:#1c1c1e; --sub:#6c6c70; --line:#e5e5ea; --bg:#fff; --accent:#2c5f45; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f2f2f7; --sub:#98989f; --line:#38383a; --bg:#1c1c1e; --accent:#7fb89a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:48px 20px 96px; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.85; font-size:16px; -webkit-text-size-adjust:100%; }
  main { max-width:680px; margin:0 auto; }
  h1 { font-size:26px; line-height:1.4; margin:0 0 8px; letter-spacing:.01em; }
  .lede { font-size:17px; margin:24px 0 40px; padding:20px 22px;
    border-left:3px solid var(--accent); background:rgba(127,184,154,.09); border-radius:0 8px 8px 0; }
  h2 { font-size:19px; margin:44px 0 12px; padding-top:24px; border-top:1px solid var(--line); }
  h2:first-of-type { border-top:none; padding-top:0; }
  p { margin:0 0 16px; }
  ul { margin:0 0 16px; padding-left:1.3em; }
  li { margin-bottom:8px; }
  .meta { color:var(--sub); font-size:14px; margin-top:0; }
  footer { margin-top:56px; padding-top:24px; border-top:1px solid var(--line); color:var(--sub); font-size:14px; }
  a { color:var(--accent); }
  .fill { background:rgba(255,204,0,.35); padding:2px 5px; border-radius:3px; font-weight:600; }
</style>
</head>
<body>
<main>
<h1>FieldMammoth</h1>
<p class="meta">渓流釣り向けの iOS 地図アプリ（フィールドマンモス）</p>
<ul>
  <li><a href="./privacy.html">プライバシーポリシー</a></li>
  <li><a href="./support.html">サポート</a></li>
</ul>
<footer>生駒祐貴</footer>
</main>
</body>
</html>
